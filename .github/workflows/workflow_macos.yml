name: MacOS Build

on:
  push:
    paths:
      - '**/*'
      - '!appveyor.yml'
      - '!README.md'
      - '!doc/**'
      - '!**/.github/**'
      - '.github/workflows/workflow_macos.yml'
  pull_request:
    paths:
      - '**/*'
      - '!appveyor.yml'
      - '!README.md'
      - '!doc/**'
      - '!**/.github/**'
      - '.github/workflows/workflow_macos.yml'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  macOS:
    name: Apple Silicon arm64 (${{ matrix.graphics }})
    timeout-minutes: 180
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - graphics: opengl-fallback
            cmake_extra_args: -DWITH_GRAPHICS_METAL=OFF
            run_metal_smoke: '0'
          - graphics: metal
            cmake_extra_args: -DWITH_GRAPHICS_METAL=ON -DWITH_GRAPHICS_METAL_REQUIRE_METALLIB=ON
            run_metal_smoke: '1'
    env:
      OPENTOONZ_APP: toonz/build/nix-relwithdebinfo/toonz/OpenToonz.app
      OPENTOONZ_DMG: toonz/build/nix-relwithdebinfo/toonz/OpenToonz.dmg
      OPENTOONZ_REQUIRED_ARCH: arm64
      OPENTOONZ_ALLOW_UNIVERSAL: '0'
      OPENTOONZ_CI_BUILD_LABEL: macos-arm64-${{ matrix.graphics }}
      OPENTOONZ_CMAKE_EXTRA_ARGS: ${{ matrix.cmake_extra_args }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      MACOS_DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
      MACOS_NOTARY_KEYCHAIN_PROFILE: ${{ secrets.MACOS_NOTARY_KEYCHAIN_PROFILE }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install mise
        uses: jdx/mise-action@v3
        with:
          install: false

      - name: Confirm Apple Silicon runner
        run: |
          uname -a
          test "$(uname -m)" = "arm64"

      - name: Trust mise configuration
        run: mise trust --yes ./mise.toml

      - name: Check pinned toolchain
        run: mise run doctor

      - name: Check graphics modernization invariants
        run: |
          nix develop path:. --command bash -lc '
            bash scripts/graphics_modernization_lint.sh
            bash scripts/verify_opengl_selection_compatibility.sh
            bash scripts/verify_graphics_fixture_scenes.sh "$RUNNER_TEMP/opentoonz-graphics-fixtures"
            bash scripts/verify_golden_scene_manifest.sh --require-complete
            bash scripts/verify_macos_default_backend_decision.sh
          '

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: macos-arm64-${{ matrix.graphics }}-ccache-${{ github.sha }}
          restore-keys: |
            macos-arm64-${{ matrix.graphics }}-ccache-
            macos-arm64-

      - name: Build OpenToonz
        run: scripts/macos/ci-build-summary.sh

      - name: Show ccache stats
        if: always()
        run: nix develop path:. --command ccache --show-stats

      - name: Capture graphics API inventory
        if: always()
        run: nix develop path:. --command bash scripts/graphics_inventory.sh

      - name: Run Metal graphics probes
        if: ${{ matrix.run_metal_smoke == '1' }}
        run: |
          nix develop path:. --command bash scripts/verify_metal_probe_images.sh "$RUNNER_TEMP/opentoonz-metal-probe-images"
          nix develop path:. --command bash scripts/verify_macos_offscreen_style_probes.sh
          nix develop path:. --command bash scripts/verify_macos_preview_export_probe.sh "$RUNNER_TEMP/opentoonz-preview-export-probe"
          nix develop path:. --command bash scripts/graphics_shaderfx_compare.sh "$RUNNER_TEMP/opentoonz-shaderfx-compare"
          nix develop path:. --command bash scripts/verify_shaderfx_scene_fixtures.sh "$RUNNER_TEMP/opentoonz-shaderfx-compare"

      - name: Bundle app
        run: mise run package-macos

      - name: Verify arm64 bundle
        run: mise run check-macos-arm64

      - name: Verify Metal shader resources
        if: ${{ matrix.run_metal_smoke == '1' }}
        run: |
          bash scripts/macos/verify-bundled-qt-runtime.sh "$OPENTOONZ_APP"
          OPENTOONZ_REQUIRE_METALLIB=1 \
          OPENTOONZ_METAL_RESOURCE_SUMMARY="$RUNNER_TEMP/opentoonz-metal-resources/summary.txt" \
            bash scripts/macos/verify-metal-resources.sh "$OPENTOONZ_APP"
          test -x toonz/build/nix-relwithdebinfo/tnzcore/tgraphics_metal_probe
          test -x toonz/build/nix-relwithdebinfo/stdfx/shaderfx_metal_probe

      - name: Run packaged tcomposer scene export
        if: ${{ matrix.run_metal_smoke == '1' }}
        run: |
          bash scripts/verify_macos_tcomposer_scene_export.sh \
            "$RUNNER_TEMP/opentoonz-tcomposer-scene-export"

      - name: Run packaged preview export app smoke
        if: ${{ matrix.run_metal_smoke == '1' }}
        run: |
          OPENTOONZ_GRAPHICS_FIXTURE_DIR="$RUNNER_TEMP/opentoonz-graphics-fixtures" \
          OPENTOONZ_GRAPHICS_SMOKE_BACKENDS="opengl metal" \
          OPENTOONZ_GRAPHICS_SMOKE_SECONDS=5 \
          OPENTOONZ_GRAPHICS_SMOKE_COOLDOWN_SECONDS=2 \
          bash scripts/verify_macos_preview_export_app_smoke.sh \
            "$RUNNER_TEMP/opentoonz-preview-export-app-smoke"

      - name: Run packaged style editor app smoke
        if: ${{ matrix.run_metal_smoke == '1' }}
        run: |
          OPENTOONZ_GRAPHICS_SMOKE_BACKENDS="opengl metal" \
          OPENTOONZ_GRAPHICS_SMOKE_SECONDS=5 \
          OPENTOONZ_GRAPHICS_SMOKE_COOLDOWN_SECONDS=2 \
          bash scripts/verify_macos_style_editor_app_smoke.sh \
            "$RUNNER_TEMP/opentoonz-style-editor-app-smoke"

      - name: Run packaged viewer input app smoke
        if: ${{ matrix.run_metal_smoke == '1' }}
        run: |
          OPENTOONZ_GRAPHICS_SMOKE_BACKENDS="opengl metal" \
          OPENTOONZ_GRAPHICS_SMOKE_SECONDS=5 \
          OPENTOONZ_GRAPHICS_SMOKE_COOLDOWN_SECONDS=2 \
          bash scripts/verify_macos_viewer_input_app_smoke.sh \
            "$RUNNER_TEMP/opentoonz-viewer-input-app-smoke"

      - name: Run packaged drawing gesture app smoke
        if: ${{ matrix.run_metal_smoke == '1' }}
        run: |
          OPENTOONZ_GRAPHICS_SMOKE_BACKENDS="opengl metal" \
          OPENTOONZ_GRAPHICS_SMOKE_SECONDS=25 \
          OPENTOONZ_GRAPHICS_SMOKE_COOLDOWN_SECONDS=2 \
          bash scripts/verify_macos_drawing_gesture_app_smoke.sh \
            "$RUNNER_TEMP/opentoonz-drawing-gesture-app-smoke"

      - name: Run packaged manifest graphics smoke
        if: ${{ matrix.run_metal_smoke == '1' }}
        run: |
          OPENTOONZ_GRAPHICS_FIXTURE_DIR="$RUNNER_TEMP/opentoonz-graphics-fixtures" \
          OPENTOONZ_SHADERFX_COMPARE_DIR="$RUNNER_TEMP/opentoonz-shaderfx-compare" \
          OPENTOONZ_GRAPHICS_SMOKE_BACKENDS="opengl metal" \
          OPENTOONZ_GRAPHICS_SMOKE_SECONDS=5 \
          OPENTOONZ_GRAPHICS_SMOKE_COOLDOWN_SECONDS=2 \
          OPENTOONZ_GRAPHICS_SMOKE_SCREENSHOT=1 \
          bash scripts/graphics_app_smoke_manifest.sh \
            doc/macos_graphics_golden_scenes.tsv \
            "$RUNNER_TEMP/opentoonz-graphics-app-smoke-manifest"

      - name: Run packaged direct Metal scene smoke
        if: ${{ matrix.run_metal_smoke == '1' }}
        run: |
          OPENTOONZ_GRAPHICS_SMOKE_SCENE=doc/sample_data/tga_paint.tnz \
          OPENTOONZ_GRAPHICS_SMOKE_ACTIONS=internal-editing-context \
          OPENTOONZ_GRAPHICS_SMOKE_BACKENDS=metal \
          OPENTOONZ_GRAPHICS_METAL_DIRECT_ONLY=1 \
          OPENTOONZ_GRAPHICS_SMOKE_REQUIRE_STARTUP_TRACE=1 \
          OPENTOONZ_GRAPHICS_SMOKE_REQUIRE_METAL_FRAME_TRACE=1 \
          OPENTOONZ_GRAPHICS_SMOKE_SECONDS=5 \
          OPENTOONZ_GRAPHICS_SMOKE_COOLDOWN_SECONDS=2 \
          OPENTOONZ_GRAPHICS_SMOKE_SCREENSHOT=0 \
          bash scripts/macos/graphics-app-smoke.sh \
            "$RUNNER_TEMP/opentoonz-graphics-app-smoke-direct-metal"
          bash scripts/verify_graphics_app_smoke_artifacts.sh \
            "$RUNNER_TEMP/opentoonz-graphics-app-smoke-direct-metal" \
            --require-direct-metal-frame

      - name: Import Apple signing certificate
        if: ${{ github.event_name == 'release' && matrix.graphics == 'opengl-fallback' && env.MACOS_CERTIFICATE_P12_BASE64 != '' && env.MACOS_CERTIFICATE_PASSWORD != '' }}
        run: |
          keychain_password="${MACOS_KEYCHAIN_PASSWORD:-temporary-ci-keychain-password}"
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/opentoonz-signing.keychain-db"

          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

      - name: Sign app for release
        if: ${{ github.event_name == 'release' && matrix.graphics == 'opengl-fallback' }}
        run: scripts/macos/sign-notarize.sh

      - name: Create DMG
        run: mise run dmg-macos

      - name: Sign and notarize DMG for release
        if: ${{ github.event_name == 'release' && matrix.graphics == 'opengl-fallback' }}
        run: scripts/macos/sign-notarize.sh

      - name: Upload CI build summaries
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: OpenToonz-macos-arm64-${{ matrix.graphics }}-ci-summary-${{ github.sha }}
          path: ${{ runner.temp }}/opentoonz-ci/*
          if-no-files-found: ignore

      - name: Upload Metal graphics probe artifacts
        if: ${{ always() && matrix.run_metal_smoke == '1' }}
        uses: actions/upload-artifact@v6
        with:
          name: OpenToonz-macos-arm64-metal-graphics-probes-${{ github.sha }}
          path: |
            ${{ runner.temp }}/opentoonz-metal-probe-images/*
            ${{ runner.temp }}/opentoonz-metal-resources/*
            ${{ runner.temp }}/opentoonz-preview-export-probe/*
            ${{ runner.temp }}/opentoonz-shaderfx-compare/*
            ${{ runner.temp }}/opentoonz-graphics-fixtures/*
            ${{ runner.temp }}/opentoonz-tcomposer-scene-export/*
            ${{ runner.temp }}/opentoonz-preview-export-app-smoke/*
            ${{ runner.temp }}/opentoonz-style-editor-app-smoke/*
            ${{ runner.temp }}/opentoonz-viewer-input-app-smoke/*
            ${{ runner.temp }}/opentoonz-drawing-gesture-app-smoke/*
            ${{ runner.temp }}/opentoonz-graphics-app-smoke-manifest/*
            ${{ runner.temp }}/opentoonz-graphics-app-smoke-direct-metal/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        with:
          name: OpenToonz-macos-arm64-${{ matrix.graphics }}-${{ github.sha }}
          path: toonz/build/nix-relwithdebinfo/toonz/OpenToonz.dmg
